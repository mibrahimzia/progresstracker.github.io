<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Life Progress Engine</title><link rel="icon" href="data:,"/><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"/></head><body>
<section id="login-screen" class="screen"><div class="login-card"><div class="brand"><span class="brand-mark">◈</span><span class="brand-name">LIFE&nbsp;PROGRESS&nbsp;ENGINE</span></div><p class="login-sub">Private instance. Enter your passphrase.</p><form id="login-form"><input type="password" id="login-password" placeholder="passphrase" autocomplete="current-password" required/><button type="submit">Enter</button></form><p id="login-error" class="error-text" hidden></p></div></section>
<section id="app-screen" class="screen" hidden><header class="topbar"><div class="brand"><span class="brand-mark">◈</span><span class="brand-name">LIFE&nbsp;PROGRESS&nbsp;ENGINE</span></div><div class="topbar-actions"><button id="export-btn" class="ghost-btn">Export</button><button id="import-btn" class="ghost-btn">Import</button><input type="file" id="import-file" accept="application/json" hidden/><button id="logout-btn" class="ghost-btn">Logout</button></div></header>
<main class="grid"><section class="panel hero"><div class="hero-label">HOW ARE YOU?</div><div class="hero-number-row"><span id="trajectory-number" class="hero-number">0.000</span><span id="trajectory-change" class="hero-change">—</span></div><div class="range-tabs" id="range-tabs"><button data-range="1H">1H</button><button data-range="1D">1D</button><button data-range="1W">1W</button><button data-range="1M" class="active">1M</button><button data-range="1Y">1Y</button><button data-range="ALL">ALL</button></div><div class="chart-wrap"><div id="trajectory-chart" aria-label="Life trajectory chart"></div><div id="chart-tooltip" class="chart-tooltip" hidden></div><div id="chart-empty" class="chart-empty" hidden>Not enough history for this timeframe yet.</div></div><div class="hero-footer"><span id="threshold-readout">threshold —</span><span id="trend-readout">trend —</span></div></section>
<section class="panel dimensions"><h2>Dimensions</h2><div id="dimension-list" class="dimension-list"></div></section>
<section class="panel log-update"><h2>Log an update</h2><div class="mode-toggle"><button id="mode-llm" class="mode-btn active">Describe it (LLM)</button><button id="mode-manual" class="mode-btn">Manual entry</button></div><div id="llm-mode"><textarea id="llm-text" rows="5" placeholder="Tell it what happened. e.g. &quot;Spent the afternoon debugging the cooling prototype, found the bottleneck. Watched YouTube after because I was fried.&quot;"></textarea><div class="row-actions"><button id="llm-submit" class="primary-btn">Submit</button><span id="llm-status" class="status-text"></span></div></div><div id="manual-mode" hidden><div class="manual-form"><label>Dimension<select id="m-dimension"></select></label><label>Type<select id="m-type"><option value="positive">positive</option><option value="negative">negative</option><option value="maintenance">maintenance</option><option value="neutral">neutral</option><option value="correction">correction</option></select></label><div class="slider-grid"><label>magnitude <input type="range" id="m-magnitude" min="0" max="1" step="0.05" value="0.5"><span></span></label><label>quality <input type="range" id="m-quality" min="0" max="1" step="0.05" value="0.5"><span></span></label><label>evidence <input type="range" id="m-evidence" min="0" max="1" step="0.05" value="0.5"><span></span></label><label>significance <input type="range" id="m-significance" min="0" max="1" step="0.05" value="0.5"><span></span></label><label>persistence <input type="range" id="m-persistence" min="0" max="1" step="0.05" value="0.5"><span></span></label><label>alignment <input type="range" id="m-alignment" min="0" max="1" step="0.05" value="0.5"><span></span></label></div><textarea id="m-explanation" rows="2" placeholder="Short note on why (optional)"></textarea><div class="row-actions"><button id="m-add-btn" class="ghost-btn">Add to batch</button><button id="m-submit-btn" class="primary-btn">Submit batch</button><span id="manual-status" class="status-text"></span></div><div id="manual-batch" class="manual-batch"></div></div></div></section>
<section class="panel recent-events"><h2>Recent events</h2><div id="events-list" class="events-list"></div></section></main></section><script src="/app.js"></script></body></html>
