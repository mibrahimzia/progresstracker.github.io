<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE — Progress Tracker</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #141a21;
    --panel-border: #22292f;
    --text: #c9d1d9;
    --muted: #7d8890;
    --green: #3fb950;
    --green-dim: #1a3b22;
    --red: #f85149;
    --red-dim: #3d1c1a;
    --amber: #d29922;
    --mono: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
    --sans: -apple-system, 'Inter', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:24px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--panel-border);
    padding-bottom:16px;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:12px;
  }
  .ticker-label{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:3px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .ticker-value{
    font-family:var(--mono);
    font-size:44px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .ticker-delta{
    font-size:16px;
    font-weight:600;
  }
  .status-pill{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:1px;
    padding:4px 10px;
    border-radius:3px;
    text-transform:uppercase;
  }
  .pill-green{background:var(--green-dim); color:var(--green); border:1px solid var(--green);}
  .pill-red{background:var(--red-dim); color:var(--red); border:1px solid var(--red);}
  .pill-neutral{background:#1c2128; color:var(--muted); border:1px solid var(--panel-border);}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:20px;
  }
  button, .file-btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--panel-border);
    border-radius:5px;
    padding:9px 14px;
    cursor:pointer;
  }
  button:hover, .file-btn:hover{border-color:var(--muted);}
  button.primary{background:var(--green-dim); border-color:var(--green); color:var(--green);}
  button.primary:hover{background:#1f4a29;}
  input[type="file"]{display:none;}
  .threshold-field{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    margin-left:auto;
  }
  .threshold-field input{
    width:60px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--amber);
    font-family:var(--mono);
    border-radius:4px;
    padding:5px 6px;
    font-size:13px;
  }

  .chart-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:16px 16px 8px 8px;
    position:relative;
  }
  .empty-state{
    font-family:var(--mono);
    color:var(--muted);
    text-align:center;
    padding:80px 20px;
    font-size:14px;
  }
  svg{display:block; width:100%; height:auto; overflow:visible;}
  .gridline{stroke:var(--panel-border); stroke-width:1;}
  .axis-label{fill:var(--muted); font-family:var(--mono); font-size:10px;}
  .threshold-line{stroke:var(--amber); stroke-width:1; stroke-dasharray:4 4;}
  .point{cursor:pointer; stroke:var(--bg); stroke-width:2;}
  .point:hover{stroke-width:3;}

  .tooltip{
    position:absolute;
    background:#1c2128;
    border:1px solid var(--panel-border);
    border-radius:6px;
    padding:10px 12px;
    font-size:12px;
    max-width:260px;
    pointer-events:none;
    display:none;
    z-index:10;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  .tooltip .tt-date{font-family:var(--mono); color:var(--muted); font-size:11px; margin-bottom:4px;}
  .tooltip .tt-title{font-weight:700; margin-bottom:6px;}
  .tooltip .tt-agg{font-family:var(--mono); font-weight:700; margin-bottom:6px;}
  .tooltip .tt-comment{color:var(--muted); line-height:1.4; margin-bottom:6px;}
  .tooltip .tt-domains{font-family:var(--mono); font-size:11px; color:var(--text); display:flex; flex-wrap:wrap; gap:6px;}
  .tt-domain-chip{background:#0d1117; border:1px solid var(--panel-border); border-radius:3px; padding:2px 6px;}

  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    align-items:center; justify-content:center;
    z-index:100;
  }
  .modal{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:20px;
    width:min(520px, 90vw);
    max-height:85vh;
    overflow-y:auto;
  }
  .modal h2{margin:0 0 4px 0; font-size:16px;}
  .modal p.hint{color:var(--muted); font-size:12px; margin:0 0 14px 0; line-height:1.5;}
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab-btn{
    flex:1; padding:7px; font-size:12px; border-radius:5px;
    background:#0d1117; border:1px solid var(--panel-border); color:var(--muted); cursor:pointer;
  }
  .tab-btn.active{color:var(--text); border-color:var(--muted);}
  textarea, .manual-form input, .manual-form textarea{
    width:100%;
    background:#0d1117;
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:var(--mono);
    font-size:12px;
    border-radius:5px;
    padding:8px;
    resize:vertical;
  }
  textarea{min-height:160px;}
  .manual-form{display:none; flex-direction:column; gap:10px;}
  .manual-form label{font-size:11px; color:var(--muted); margin-bottom:3px; display:block; font-family:var(--sans);}
  .domain-row{display:flex; gap:8px; align-items:center;}
  .domain-row input[type="text"]{flex:2;}
  .domain-row input[type="number"]{flex:1;}
  .remove-domain{background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; padding:0 6px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .error-msg{color:var(--red); font-size:12px; margin-top:8px; display:none;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="ticker-label">Life // Progress</div>
      <div class="ticker-value">
        <span id="currentValue">—</span>
        <span class="ticker-delta" id="currentDelta"></span>
      </div>
    </div>
    <div id="statusPill" class="status-pill pill-neutral">No data</div>
  </header>

  <div class="toolbar">
    <label class="file-btn" for="loadInput">Load file</label>
    <input type="file" id="loadInput" accept="application/json">
    <button id="saveBtn">Save file</button>
    <button class="primary" id="addBtn">+ Add entry</button>
    <div class="threshold-field">
      view
      <select id="rangeInput" style="background:var(--panel);border:1px solid var(--panel-border);color:var(--text);font-family:var(--mono);border-radius:4px;padding:5px 6px;font-size:13px">
        <option value="auto">auto</option><option value="7">week</option><option value="30">month</option><option value="90">3 months</option><option value="180">6 months</option><option value="365">year</option><option value="all">all</option>
      </select>
    </div>
    <div class="threshold-field">
      threshold
      <input type="number" id="thresholdInput" min="0" max="1" step="0.01" value="0.6">
    </div>
  </div>

  <div class="chart-panel">
    <div id="emptyState" class="empty-state">No entries yet. Load a saved file, or add your first entry to start the chart.</div>
    <svg id="chart" viewBox="0 0 900 360" style="display:none;"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Add entry</h2>
    <p class="hint">Paste the JSON object your LLM produced using the scoring rubric file, or fill in a manual entry below.</p>
    <div class="tabs">
      <button class="tab-btn active" data-tab="json">Paste JSON</button>
      <button class="tab-btn" data-tab="manual">Manual entry</button>
    </div>

    <div id="jsonTab">
      <textarea id="jsonInput" placeholder='{"date":"2026-08-23","aggregate":0.7,"domains":{"academic":0.8,"mental":0.6},"title":"...","comment":"..."}'></textarea>
    </div>

    <div id="manualTab" class="manual-form">
      <div>
        <label>Date</label>
        <input type="date" id="manualDate">
      </div>
      <div>
        <label>Aggregate score (0-1)</label>
        <input type="number" id="manualAggregate" min="0" max="1" step="0.05">
      </div>
      <div>
        <label>Title</label>
        <input type="text" id="manualTitle" placeholder="Short heading for this period">
      </div>
      <div>
        <label>Comment</label>
        <textarea id="manualComment" style="min-height:70px;" placeholder="What happened, in your own words"></textarea>
      </div>
      <div>
        <label>Domains</label>
        <div id="domainRows"></div>
        <button type="button" id="addDomainRow" style="margin-top:6px;">+ domain</button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="modal-actions">
      <button id="cancelBtn">Cancel</button>
      <button class="primary" id="confirmAddBtn">Add to chart</button>
    </div>
  </div>
</div>

<script>
let data={threshold:.6,entries:[]};
let viewMode='auto';
const STORAGE='life-tracker-data-v2';
const els={currentValue:document.getElementById('currentValue'),currentDelta:document.getElementById('currentDelta'),statusPill:document.getElementById('statusPill'),emptyState:document.getElementById('emptyState'),chart:document.getElementById('chart'),tooltip:document.getElementById('tooltip'),thresholdInput:document.getElementById('thresholdInput'),rangeInput:document.getElementById('rangeInput'),loadInput:document.getElementById('loadInput'),saveBtn:document.getElementById('saveBtn'),addBtn:document.getElementById('addBtn'),modalOverlay:document.getElementById('modalOverlay'),cancelBtn:document.getElementById('cancelBtn'),confirmAddBtn:document.getElementById('confirmAddBtn'),jsonInput:document.getElementById('jsonInput'),errorMsg:document.getElementById('errorMsg'),domainRows:document.getElementById('domainRows'),addDomainRow:document.getElementById('addDomainRow')};
function colorFor(v){return v>=data.threshold?'#3fb950':'#f85149'}
function saveLocal(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){}}
function cleanEntry(e){const a=Number(e.aggregate);if(!e.date||!Number.isFinite(a)||a<0||a>1)throw new Error('entry needs a date and aggregate between 0 and 1');const d={};for(const[k,v]of Object.entries(e.domains||{})){const n=Number(v);if(Number.isFinite(n)&&n>=0&&n<=1)d[k]=n}return{date:String(e.date),aggregate:a,domains:d,title:String(e.title||''),comment:String(e.comment||'')}}
function restore(){try{const r=localStorage.getItem(STORAGE);if(r){const p=JSON.parse(r);if(Array.isArray(p.entries)){data={threshold:Math.min(1,Math.max(0,Number(p.threshold??.6))),entries:p.entries.map(cleanEntry)}}}}catch(e){console.warn(e)}}
function sorted(){return [...data.entries].sort((a,b)=>new Date(a.date)-new Date(b.date))}
function dateLabel(d,span){const x=new Date(d);return span<=45?x.toLocaleDateString(undefined,{month:'short',day:'numeric'}):span<=400?x.toLocaleDateString(undefined,{month:'short',year:'numeric'}):String(x.getFullYear())}
function render(){const entries=sorted();els.thresholdInput.value=data.threshold.toFixed(2);if(!entries.length){els.emptyState.style.display='block';els.chart.style.display='none';els.currentValue.textContent='—';els.currentDelta.textContent='';els.statusPill.textContent='No data';els.statusPill.className='status-pill pill-neutral';return}els.emptyState.style.display='none';els.chart.style.display='block';const latest=entries.at(-1),prev=entries.at(-2);els.currentValue.textContent=latest.aggregate.toFixed(2);els.currentValue.style.color=colorFor(latest.aggregate);if(prev){const d=latest.aggregate-prev.aggregate;els.currentDelta.textContent=(d>=0?'▲ +':'▼ ')+d.toFixed(2);els.currentDelta.style.color=d>=0?'#3fb950':'#f85149'}else els.currentDelta.textContent='';if(latest.aggregate>=data.threshold){els.statusPill.textContent='On track';els.statusPill.className='status-pill pill-green'}else{els.statusPill.textContent='Below threshold';els.statusPill.className='status-pill pill-red'}drawChart(entries)}
function rangeFor(entries){const allMin=new Date(entries[0].date).getTime(),allMax=new Date(entries.at(-1).date).getTime();let span=Math.max(7*86400000,allMax-allMin);let min=allMin,max=allMax;if(viewMode==='all'){min=allMin;max=allMax||allMin+7*86400000}else if(viewMode==='auto'){span=Math.max(30*86400000,Math.min(180*86400000,span));max=allMax;min=max-span}else{span=Number(viewMode)*86400000;max=allMax;min=max-span}if(max===min){min-=3.5*86400000;max+=3.5*86400000}return{min,max,allMin,allMax}}
function drawChart(entries){const W=900,H=360,pL=40,pR=20,pT=20,pB=30,plotW=W-pL-pR,plotH=H-pT-pB,{min,max}=rangeFor(entries),span=Math.max(1,max-min),xs=d=>pL+(new Date(d).getTime()-min)/span*plotW,ys=v=>pT+(1-v)*plotH;let svg=`<defs><linearGradient id="greenFade" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#3fb950" stop-opacity=".45"/><stop offset="100%" stop-color="#3fb950" stop-opacity="0"/></linearGradient><linearGradient id="redFade" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f85149" stop-opacity=".42"/><stop offset="100%" stop-color="#f85149" stop-opacity="0"/></linearGradient></defs>`;[0,.25,.5,.75,1].forEach(v=>{const y=ys(v);svg+=`<line class="gridline" x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}"/><text class="axis-label" x="${pL-8}" y="${y+3}" text-anchor="end">${v.toFixed(2)}</text>`});const ty=ys(data.threshold);svg+=`<line class="threshold-line" x1="${pL}" y1="${ty}" x2="${W-pR}" y2="${ty}"/><text class="axis-label" x="${W-pR}" y="${ty-4}" text-anchor="end" fill="#d29922">threshold ${data.threshold.toFixed(2)}</text>`;const ticks=6;for(let i=0;i<=ticks;i++){const t=min+(span*i/ticks),x=pL+(i/ticks)*plotW;svg+=`<line x1="${x}" y1="${pT}" x2="${x}" y2="${H-pB}" stroke="#22292f" opacity=".35"/><text class="axis-label" x="${x}" y="${H-pB+16}" text-anchor="middle">${dateLabel(t,span/86400000)}</text>`}
const visible=entries.filter(e=>{const t=new Date(e.date).getTime();return t>=min&&t<=max});
if(visible.length){for(let i=0;i<visible.length-1;i++){const a=visible[i],b=visible[i+1],ax=xs(a.date),ay=ys(a.aggregate),bx=xs(b.date),by=ys(b.aggregate),aa=a.aggregate>=data.threshold,bb=b.aggregate>=data.threshold;const seg=[];if(aa===bb)seg.push([ax,ay,bx,by,aa]);else{const q=(data.threshold-a.aggregate)/(b.aggregate-a.aggregate),cx=ax+(bx-ax)*q,cy=ty;seg.push([ax,ay,cx,cy,aa],[cx,cy,bx,by,bb])}for(const[z1,z2,z3,z4,above]of seg){const grad=above?'url(#greenFade)':'url(#redFade)';const area=`M ${z1} ${z2} L ${z3} ${z4} L ${z3} ${pT+plotH} L ${z1} ${pT+plotH} Z`;svg+=`<path d="${area}" fill="${grad}"/><line x1="${z1}" y1="${z2}" x2="${z3}" y2="${z4}" stroke="${above?'#3fb950':'#f85149'}" stroke-width="2.5" stroke-linecap="round"/>`}}visible.forEach((e,i)=>{const x=xs(e.date),y=ys(e.aggregate);svg+=`<circle class="point" data-idx="${i}" cx="${x}" cy="${y}" r="5" fill="${colorFor(e.aggregate)}"/>`})}
els.chart.setAttribute('viewBox',`0 0 ${W} ${H}`);els.chart.innerHTML=svg;els.chart.querySelectorAll('.point').forEach(c=>{c.addEventListener('mouseenter',ev=>showTooltip(ev,visible[+c.dataset.idx]));c.addEventListener('mousemove',positionTooltip);c.addEventListener('mouseleave',hideTooltip)})}
function showTooltip(ev,e){const dh=Object.entries(e.domains||{}).map(([k,v])=>`<span class="tt-domain-chip">${k} ${Number(v).toFixed(2)}</span>`).join('');els.tooltip.innerHTML=`<div class="tt-date">${e.date}</div><div class="tt-title">${e.title||''}</div><div class="tt-agg" style="color:${colorFor(e.aggregate)}">${Number(e.aggregate).toFixed(2)}</div><div class="tt-comment">${e.comment||''}</div>${dh?`<div class="tt-domains">${dh}</div>`:''}`;els.tooltip.style.display='block';positionTooltip(ev)}
function positionTooltip(ev){const r=els.chart.parentElement.getBoundingClientRect();els.tooltip.style.left=(ev.clientX-r.left+14)+'px';els.tooltip.style.top=(ev.clientY-r.top-10)+'px'}function hideTooltip(){els.tooltip.style.display='none'}
els.thresholdInput.addEventListener('change',()=>{const v=Number(els.thresholdInput.value);if(Number.isFinite(v)&&v>=0&&v<=1){data.threshold=v;saveLocal();render()}});els.rangeInput.addEventListener('change',()=>{viewMode=els.rangeInput.value;render()});
els.loadInput.addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=e=>{try{const p=JSON.parse(e.target.result);if(!Array.isArray(p.entries))throw new Error('missing entries array');data={threshold:typeof p.threshold==='number'?Math.min(1,Math.max(0,p.threshold)):.6,entries:p.entries.map(cleanEntry)};saveLocal();render()}catch(err){alert('Could not read that file — '+err.message)}};reader.readAsText(f);ev.target.value=''})
els.saveBtn.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='life-tracker-data.json';a.click();URL.revokeObjectURL(url)});
els.addBtn.addEventListener('click',()=>{els.modalOverlay.style.display='flex';els.errorMsg.style.display='none';els.jsonInput.value='';document.getElementById('manualDate').value=new Date().toISOString().slice(0,10);document.getElementById('manualAggregate').value='';document.getElementById('manualTitle').value='';document.getElementById('manualComment').value='';els.domainRows.innerHTML='';addDomainRowFn()});els.cancelBtn.addEventListener('click',()=>els.modalOverlay.style.display='none');els.modalOverlay.addEventListener('click',e=>{if(e.target===els.modalOverlay)els.modalOverlay.style.display='none'});
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const t=btn.dataset.tab;document.getElementById('jsonTab').style.display=t==='json'?'block':'none';document.getElementById('manualTab').style.display=t==='manual'?'flex':'none'}));
function addDomainRowFn(name='',value=''){const row=document.createElement('div');row.className='domain-row';row.innerHTML=`<input type="text" placeholder="domain name" value="${name}"><input type="number" min="0" max="1" step="0.01" placeholder="0-1" value="${value}"><button type="button" class="remove-domain">×</button>`;row.querySelector('.remove-domain').addEventListener('click',()=>row.remove());els.domainRows.appendChild(row)}els.addDomainRow.addEventListener('click',()=>addDomainRowFn());
els.confirmAddBtn.addEventListener('click',()=>{try{let entry;const tab=document.querySelector('.tab-btn.active').dataset.tab;if(tab==='json')entry=JSON.parse(els.jsonInput.value);else{const domains={};els.domainRows.querySelectorAll('.domain-row').forEach(row=>{const [n,v]=row.querySelectorAll('input'),name=n.value.trim(),val=Number(v.value);if(name&&Number.isFinite(val))domains[name]=val});entry={date:document.getElementById('manualDate').value,aggregate:Number(document.getElementById('manualAggregate').value),domains,title:document.getElementById('manualTitle').value.trim(),comment:document.getElementById('manualComment').value.trim()}};data.entries.push(cleanEntry(entry));saveLocal();els.modalOverlay.style.display='none';render()}catch(err){els.errorMsg.textContent='Could not add entry — '+err.message;els.errorMsg.style.display='block'}});
// Wheel zoom: zoom toward the middle of the graph while keeping the selected time scale easy to recover.
els.chart.addEventListener('wheel',e=>{if(sorted().length<2)return;e.preventDefault();const opts=['7','30','90','180','365','all'],cur=opts.indexOf(viewMode);if(e.deltaY>0)viewMode=opts[Math.min(opts.length-1,cur+1<0?1:cur+1)];else viewMode=opts[Math.max(0,cur<0?1:cur-1)];els.rangeInput.value=viewMode;render()},{passive:false});
try{const raw=localStorage.getItem(STORAGE);if(raw){const p=JSON.parse(raw);if(Array.isArray(p.entries))data={threshold:Number(p.threshold??.6),entries:p.entries.map(cleanEntry)}}}catch(e){}
render();
</script>
</body>
</html>
